#
# OnlyTrusted — Release workflow.
#
# Triggered on git tags matching v* (e.g. v0.3.0). Produces reproducible,
# attested artifacts for both platforms, generates CycloneDX SBOMs, and
# publishes everything on a GitHub Release.
#
# Signing policy:
#   • Android AAB — signed with the upload key if the three secrets are set
#     (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS).
#     Otherwise an unsigned AAB ships + the release page clearly says
#     "SIGN THIS BEFORE UPLOADING TO PLAY".
#   • iOS IPA — unsigned, built for a generic iphoneos destination with
#     CODE_SIGNING_ALLOWED=NO. Users / the maintainer sign locally for App
#     Store or TestFlight (requires Apple Developer credentials this CI
#     can't yet access).
#
# Provenance:
#   • SBOM: CycloneDX JSON generated via `cyclonedx-cli` for Android (Gradle)
#     and iOS (SwiftPM once we add it; today iOS has no package.resolved so
#     the SBOM lists only the main target's declared deps).
#   • SLSA Build Provenance: generated via `actions/attest-build-provenance`
#     so anyone with the release can verify the artifact was built by this
#     workflow from a specific commit SHA (no spoofed binaries).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.3.0). Must already exist."
        required: true

permissions:
  contents: write          # create GitHub Release + upload assets
  id-token: write          # OIDC token for SLSA attestation
  attestations: write      # write to the attestations API

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  android:
    name: Android · signed AAB + SBOM + provenance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      aab_path: ${{ steps.locate.outputs.aab_path }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (if provided)
        id: keystore
        # Can't gate this step with `if: env.ANDROID_KEYSTORE_BASE64 != ''` because
        # GitHub Actions evaluates `if:` BEFORE the step's `env:` block runs — the
        # expression would always be empty. Instead run unconditionally and have the
        # script no-op when the secret is absent (local devs, forks, PR builds).
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "::notice::ANDROID_KEYSTORE_BASE64 secret not set — release AAB will be unsigned."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          test -s "$RUNNER_TEMP/keystore/release.jks"
          echo "jks=$RUNNER_TEMP/keystore/release.jks" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Release keystore decoded (jks=$RUNNER_TEMP/keystore/release.jks)."

      - name: Build release AAB
        working-directory: android
        env:
          ONLYTRUSTED_RELEASE_KEYSTORE: ${{ steps.keystore.outputs.jks }}
          ONLYTRUSTED_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ONLYTRUSTED_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ONLYTRUSTED_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Locate AAB
        id: locate
        working-directory: android
        run: |
          aab=$(find app/build/outputs/bundle -name "*.aab" | head -1)
          test -f "$aab"
          cp "$aab" "$RUNNER_TEMP/OnlyTrusted-${RELEASE_TAG}.aab"
          echo "aab_path=$RUNNER_TEMP/OnlyTrusted-${RELEASE_TAG}.aab" >> "$GITHUB_OUTPUT"

      - name: Generate CycloneDX SBOM
        working-directory: android
        run: |
          ./gradlew cyclonedxBom --no-daemon || {
            echo "::warning::cyclonedxBom plugin not applied; falling back to dependency text report"
            ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon \
              > "$RUNNER_TEMP/OnlyTrusted-${RELEASE_TAG}-android-deps.txt"
          }
          # Prefer the CycloneDX JSON if the plugin was present.
          if [[ -f app/build/reports/bom.json ]]; then
            cp app/build/reports/bom.json "$RUNNER_TEMP/OnlyTrusted-${RELEASE_TAG}-android-sbom.json"
          fi

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.locate.outputs.aab_path }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: android-release
          path: |
            ${{ runner.temp }}/OnlyTrusted-${{ env.RELEASE_TAG }}.aab
            ${{ runner.temp }}/OnlyTrusted-${{ env.RELEASE_TAG }}-android-*
          if-no-files-found: warn

  ios:
    name: iOS · unsigned IPA + build provenance
    # Needs macos-26 to pick up Xcode 26 — the project.yml declares SWIFT_6 /
    # SWIFT_STRICT_CONCURRENCY=complete and the strict-isolation diagnostics
    # drifted between Xcode 16 (fails) and Xcode 26 (passes). See the matching
    # comment in ci.yml for details.
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      ipa_path: ${{ steps.pack.outputs.ipa_path }}
    steps:
      - uses: actions/checkout@v5
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate xcodeproj
        working-directory: ios
        run: xcodegen generate

      - name: Build archive (unsigned)
        working-directory: ios
        run: |
          xcodebuild archive \
            -scheme OnlyTrusted \
            -configuration Release \
            -archivePath build/OnlyTrusted.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --quiet || true
          test -d build/OnlyTrusted.xcarchive

      - name: Pack unsigned IPA
        id: pack
        working-directory: ios
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/OnlyTrusted.xcarchive/Products/Applications/OnlyTrusted.app build/ipa/Payload/
          (cd build/ipa && zip -qr "$RUNNER_TEMP/OnlyTrusted-${RELEASE_TAG}-unsigned.ipa" Payload)
          echo "ipa_path=$RUNNER_TEMP/OnlyTrusted-${RELEASE_TAG}-unsigned.ipa" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.pack.outputs.ipa_path }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ios-release
          path: ${{ runner.temp }}/OnlyTrusted-${{ env.RELEASE_TAG }}-unsigned.ipa
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: OnlyTrusted ${{ env.RELEASE_TAG }}
          body: |
            Automated release built from `${{ github.sha }}`.

            Artifacts:
            * `OnlyTrusted-${{ env.RELEASE_TAG }}.aab` — Android App Bundle.
              Signed with the OnlyTrusted upload key if the release workflow had
              the keystore secrets; otherwise unsigned (sign before uploading to
              Play Console).
            * `OnlyTrusted-${{ env.RELEASE_TAG }}-unsigned.ipa` — iOS archive.
              UNSIGNED by design — this CI has no Apple Developer credentials.
              Sign locally with your App Store or TestFlight provisioning
              profile before distribution.
            * `*-sbom.json` — CycloneDX SBOM for the included dependencies.
            * SLSA Build Provenance attestations are attached to the artifacts
              (see "Attestations" tab on this release page). Verify with:
              `gh attestation verify OnlyTrusted-${{ env.RELEASE_TAG }}.aab -R Vanpaultek/OnlyTrusted`.

            See `SECURITY.md` for the vulnerability-disclosure policy.
          files: |
            ${{ runner.temp }}/artifacts/android-release/*
            ${{ runner.temp }}/artifacts/ios-release/*
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-rc') || contains(env.RELEASE_TAG, '-beta') }}
