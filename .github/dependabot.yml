#
# Dependabot — automated dependency security updates.
#
# OnlyTrusted ships entirely on-device with no network calls, so a compromised
# dependency is the primary supply-chain risk. Dependabot opens PRs when any
# tracked dependency ships a new version so a human reviewer can look at the
# diff before it lands.

version: 2
updates:
  # Android — Gradle (Kotlin + Java deps).
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, android]
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlinx:
        patterns: ["org.jetbrains.kotlinx:*", "org.jetbrains.kotlin:*"]

  # GitHub Actions used in CI / release workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
