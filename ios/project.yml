name: OnlyTrusted
options:
  minimumXcodeGenVersion: "2.40.0"
  bundleIdPrefix: com.onlytrusted
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "26.0"

# The 9 shipped locales (en + 8 others) are declared inside
# OnlyTrusted/Resources/Localization/Localizable.xcstrings and the Android
# resourceConfigurations list in android/app/build.gradle.kts. Xcode
# compiles the .xcstrings into per-locale .strings files at build time, so
# the project-level knownRegions doesn't need to list every locale — the
# OS resolves locale from the bundle's compiled <lang>.lproj dirs.

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: NO
    # VanPaulTek Inc Apple Developer team — placeholder, unverified against Apple's
    # provisioning service as of 2026-10-20 (Xcode has no Apple ID signed in on this
    # machine, so a device build cannot resolve profiles). Simulator builds work with
    # CODE_SIGNING_ALLOWED=NO regardless. When ready for a real-device build:
    #   1) Xcode → Settings → Accounts → add the Apple ID for VanPaulTek Inc.
    #   2) Confirm the 10-char Team ID matches the string below.
    #   3) xcodegen generate && xcodebuild ... build (drop CODE_SIGNING_ALLOWED=NO).
    DEVELOPMENT_TEAM: "H86SA2C3S5"
    CODE_SIGN_STYLE: Automatic

targets:
  # --- Main app ----------------------------------------------------------------
  OnlyTrusted:
    type: application
    platform: iOS
    sources:
      - path: OnlyTrusted/Sources
      - path: OnlyTrusted/Assets.xcassets
      # Offline Threat Intel (Elite) — bundled .txt / .json feeds loaded at launch.
      # Added as a resource folder so XcodeGen keeps the files in the bundle without
      # trying to compile them. Keep tightly scoped to the four shipping files.
      - path: OnlyTrusted/Data
        type: folder
      # i18n resources (v0.3.4+). Localizable.xcstrings is the Apple String
      # Catalog with 155 keys × 8 locales — SwiftUI auto-resolves Text("key")
      # lookups against it at render time. countries.json backs the Settings →
      # Language & Region picker's region/country/language cascade.
      # Were previously hand-added to pbxproj and silently dropped the first
      # time xcodegen regenerated — causing the UI to render raw string keys
      # like "dash_welcome" instead of resolved values. project.yml is the
      # source of truth so this can't happen again.
      - path: OnlyTrusted/Resources/Localization/Localizable.xcstrings
      - path: OnlyTrusted/Resources/Localization/countries.json
      # In-app docs: the User Guide + Pricing Chart ship as static HTML/CSS/JS
      # bundles so they work 100% offline (matches the zero-cloud ethos).
      # Added as resource folders so XcodeGen preserves the subfolder structure
      # — WKWebView loads index.html with allowingReadAccessTo the folder root
      # so relative paths to assets/, content.json, plans.json all resolve.
      - path: OnlyTrusted/Resources/guide
        type: folder
      - path: OnlyTrusted/Resources/pricing
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onlytrusted.app
        CODE_SIGN_ENTITLEMENTS: Entitlements/OnlyTrusted.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: OnlyTrusted/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "OnlyTrusted uses Face ID to unlock the app and the family vault."
        INFOPLIST_KEY_CFBundleDisplayName: "OnlyTrusted"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: CallDirectoryExtension
      - target: MessageFilterExtension
      - target: SmartLinkGuardExtension

  # --- Call Directory Extension ------------------------------------------------
  CallDirectoryExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: CallDirectoryExtension
      - path: OnlyTrusted/Sources/Shared
      - path: OnlyTrusted/Sources/Vault/PhoneUtils.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onlytrusted.app.CallDirectoryExtension
        CODE_SIGN_ENTITLEMENTS: Entitlements/CallDirectoryExtension.entitlements
        INFOPLIST_FILE: CallDirectoryExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: "CallDirectoryExtension"
        PRODUCT_MODULE_NAME: CallDirectoryExtension
        INFOPLIST_KEY_CFBundleDisplayName: "OnlyTrusted Call Blocker"
    # Ship the bundled scam-number threat intel into the extension so blocking entries
    # cover known scam prefixes in addition to the user's manual block list.
    resources:
      - path: OnlyTrusted/Data/scam_numbers.v1.txt
        destination: Resources

  # --- Message Filter Extension ------------------------------------------------
  MessageFilterExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: MessageFilterExtension
      - path: OnlyTrusted/Sources/Shared
      - path: OnlyTrusted/Sources/Vault/PhoneUtils.swift
      - path: OnlyTrusted/Sources/SmartLinkGuard/SmartLinkGuardRules.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onlytrusted.app.MessageFilterExtension
        CODE_SIGN_ENTITLEMENTS: Entitlements/MessageFilterExtension.entitlements
        INFOPLIST_FILE: MessageFilterExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: "MessageFilterExtension"
        PRODUCT_MODULE_NAME: MessageFilterExtension
        INFOPLIST_KEY_CFBundleDisplayName: "OnlyTrusted SMS Filter"

  # --- Smart Link Guard Share Extension ----------------------------------------
  # iOS cannot intercept incoming SMS the way Android can, so instead we expose
  # Smart Link Guard as a share destination. The user shares a suspicious URL from
  # Messages / Safari / anywhere and this extension renders the on-device verdict
  # with Open / Cancel buttons. Shares the rules file with the main app target.
  SmartLinkGuardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SmartLinkGuardExtension
      - path: OnlyTrusted/Sources/SmartLinkGuard/SmartLinkGuardRules.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onlytrusted.app.SmartLinkGuardExtension
        CODE_SIGN_ENTITLEMENTS: Entitlements/SmartLinkGuardExtension.entitlements
        INFOPLIST_FILE: SmartLinkGuardExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: "SmartLinkGuardExtension"
        PRODUCT_MODULE_NAME: SmartLinkGuardExtension
        INFOPLIST_KEY_CFBundleDisplayName: "OnlyTrusted Smart Link Guard"

  # --- Unit Tests --------------------------------------------------------------
  # XCTest regression coverage for the security-critical modules. Mirrors the
  # Android JUnit coverage under android/app/src/test/. 34 tests across:
  #   - SmartLinkGuardRules (new patches + no-regression pins)
  #   - PINRateLimiter (lockout curve)
  #   - DeadmanWipeState clock-skew formula
  # Run via `xcodebuild test -scheme OnlyTrusted -only-testing:OnlyTrustedTests`.
  # Host-app TEST_HOST pattern: tests run in-process with OnlyTrusted.app, which
  # means the main app's static wiring (e.g. SmartLinkGuardRules.phishingHostLookup)
  # leaks into test state — our test cases null those out in setUp() to isolate
  # the rule set from the shipped Threat Intel feed.
  OnlyTrustedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OnlyTrustedTests
    dependencies:
      - target: OnlyTrusted
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onlytrusted.app.OnlyTrustedTests
        PRODUCT_NAME: OnlyTrustedTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OnlyTrusted.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/OnlyTrusted"
        BUNDLE_LOADER: "$(TEST_HOST)"

# Scheme overrides. xcodegen auto-generates one scheme per target, but we need
# the OnlyTrusted scheme to also build + test OnlyTrustedTests so that
# `xcodebuild test -scheme OnlyTrusted -only-testing:OnlyTrustedTests` works
# both in CI and locally without passing the test scheme explicitly.
schemes:
  OnlyTrusted:
    build:
      targets:
        OnlyTrusted: all
        OnlyTrustedTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OnlyTrustedTests
    archive:
      config: Release
